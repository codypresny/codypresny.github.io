 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRUBSTAKE: the Website!</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      background: linear-gradient(135deg, #3E2723 0%, #5D4E37 50%, #8B6F47 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Georgia', serif;
    }

    .navbar {
      background: linear-gradient(135deg, #5D4E37 0%, #3E2723 100%) !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      border-bottom: 3px solid #D4AF37;
    }

    .navbar-brand {
      color: #D4AF37 !important;
      font-weight: 900;
      font-size: 1.8rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      letter-spacing: 1px;
    }

    .nav-link {
      color: #D2B48C !important;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #D4AF37 !important;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
    }

    .card {
      border: 3px solid #D4AF37;
      border-radius: 0;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(212, 175, 55, 0.05);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(210, 180, 140, 0.05));
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 2px,
        rgba(212, 175, 55, 0.03) 2px,
        rgba(212, 175, 55, 0.03) 4px
      );
      pointer-events: none;
      border-radius: 0;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(212, 175, 55, 0.1);
    }

    .card-body {
      padding: 3rem;
      position: relative;
      z-index: 1;
    }

    .card-title {
      color: #5D4E37;
      font-weight: 900;
      font-size: 2.5rem;
      text-shadow: 1px 1px 2px rgba(212, 175, 55, 0.3);
      font-family: 'Georgia', serif;
      letter-spacing: 2px;
    }

    .card-text {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #5D4E37;
      font-weight: 500;
    }

    .btn-primary {
      background: linear-gradient(135deg, #D4AF37 0%, #AA8C2C 100%);
      color: #2C1810;
      border: 2px solid #8B6F47;
      padding: 0.8rem 2rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
      font-family: 'Georgia', serif;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #FFE066 0%, #D4AF37 100%);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
      transform: translateY(-3px);
      color: #1a0f00;
    }

    .icon-lg {
      font-size: 4rem;
      color: #D4AF37;
      margin-bottom: 1rem;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
    }

    footer {
      background: linear-gradient(135deg, #2C1810 0%, #3E2723 100%);
      color: #D2B48C;
      text-align: center;
      padding: 1.5rem;
      margin-top: auto;
      border-top: 3px solid #D4AF37;
      font-weight: 600;
    }

    .container-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold fs-5">
        <i class="bi bi-pickaxe" style="color: #D4AF37;"></i> GRUBSTAKE
      </span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="gold-generator.html">Gold Generator</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-main">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card">
            <div class="card-body text-center">
              <i class="bi bi-game-fill icon-lg"></i>
              <h1 class="card-title mb-4">GRUBSTAKE</h1>
              <p class="card-text mb-3">Welcome to Grubstakegame.com</p>
              <p class="card-text mb-3">Sux a little bit, don't it?</p>
              <p class="card-text"><em>A Them Bike Guys Subsidiary</em></p>
              <hr class="my-4">
              <a href="gold-generator.html" class="btn btn-primary mt-3">
                <i class="bi bi-coin"></i> Try Gold Generator
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <small>&copy; 2026 GRUBSTAKE. All rights reserved.</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
